var DEV=1, ERR=""; // Diagnostics kept in the source, stripped from the build.
if(DEV){ addEventListener("error",function(e){ ERR=(e.message||e)+" @"+(e.lineno||"?"); });
addEventListener("unhandledrejection",function(e){ ERR="P "+((e.reason&&e.reason.message)||e.reason); }); }
/* ==========================================================================
   RAINBOW RAID  ::  js13kGames 2026  ::  theme "Unicorns and Rainbows"
   Pastel vertical shmup. Steampunk goblins have locked the unicorns away in
   flying fortresses. Your fighter has a golden horn: go set them free.
   The feel draws on Cattle Crisis (Krystman, PICO-8): hitstop, 2-frame
   white flash, bubble-cluster explosions, proximity multiplier, pickups
   fanning out then magnetized, coyote window on death.
   Everything is generated at load time: string sprites, Web Audio sounds.
   ========================================================================== */

// ---------- Logical screen 192x256, integer-scaled ----------
var LW=192, LH=256;
var C=document.getElementById('c'), M=C.getContext('2d');
var B=mk(LW,LH), X=B.getContext('2d');
var SC=1, OX=0, OY=0, DPR=1;
function mk(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
// The logical height follows the screen (256 to 336): on a phone the game fills the width.
function resize(){ DPR=min(3,devicePixelRatio||1); C.width=innerWidth*DPR; C.height=innerHeight*DPR;
  var nh=clamp(Math.round(LW*innerHeight/innerWidth),256,336); if(nh!=LH){ LH=nh; B.height=LH; if(clouds){ var old=seed; initBg(); seed=old; if(land>=1) clouds=[]; genTo=max(-1,(scroll/T8|0)-1); } }
  SC=min(C.width/LW,C.height/LH); OX=(C.width-LW*SC)/2|0; OY=(C.height-LH*SC)/2|0; M.imageSmoothingEnabled=false; }
// ---------- Utilities ----------
var PI2=6.283, sin=Math.sin, cos=Math.cos, abs=Math.abs, min=Math.min, max=Math.max, R=Math.random;
addEventListener('resize',resize);
function rr(a,b){ return a+R()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
var clouds; resize();
function dist(a,b,c,d){ return Math.hypot(c-a,d-b); }
function rem(arr,o){ var i=arr.indexOf(o); if(i>=0) arr.splice(i,1); }
var RB=['#ff6b8a','#ffae5c','#ffe27a','#9be8c3','#8ed0ff','#c9b3ff','#ff6ad5'];

// ---------- Pastel palette + string-encoded sprites ----------
var PAL={W:'#fff8f0',K:'#3b2540',P:'#ffb3c6',Y:'#ffe27a',B:'#8ed0ff',L:'#c9b3ff',C:'#d39a63',D:'#8b5a36',S:'#dfe6ee',E:'#a8dc6e',M:'#ff6ad5'};
var SPD={
ship:['.....Y|.....Y|....KY|....KW|....KW|...KWB|...KWB|.KKKWW|KPPKWW|KPPPKW|KPPPKW|KKKKKK|...KBB|....KK',1],
shipL:['.....Y|.....Y|....KY|....KW|....KW|....KB|....KB|..KKKW|.KPKWW|.KPPKW|KKPPKW|.KKKKK|...KBB|....KK',1],
gtank:['.KKKKKKK|KDDDCECC|KDKDCYSC|KDDDCSSC|KDKDCSSC|KDDDCSSC|.KDDCCCC|..KKCCCC|.....KKD|......KD|......KD',1],
gob:['....KK|..KKKK|....KC|..KCCC|.KCSSK|KKEEEE|KEEEKE|.KEEEE|..KKKK|.KCCCC|KCDCDC|.KKKKK',1],
gun:['....KY|....KY|....KK|...KCC|..KCSS|.KCCKE|KKEEEE|KEEEKE|.KEEEE|..KKKK|.KCCCC|KCDCDC|KDDDDD|.KKKKK',1],
tank:['......KK|.....KCC|....KCSS|...KCCKE|..KKEEEE|..KEEEKE|.KCEEEEE|KCCKKKKK|KCDCCCCC|KDDDCDCD|KDKDKDKD|KKDKDKDK|.KKKKKKK',1],
base:['KK.KK.KK.KK.KK.K|KCKKCKKCKKCKKCKC|KCCCCCCCCCCCCCCC|KCDDDDDDDDDDDDDD|KCDLLLLLLLLLLLLL|KCDLKKKKLLLKKKKL|KCDLKSSKLLLKSSKL|KCDLKSSKLLLKSSKL|KCDLKKKKLLLKKKKL|KCDLLLLLLLLLLLLL|KCDDDDDDDDDDDDDD|KCCCCCCCCCCCCCCC|KDDCDDCDDCDDCDDC|KKKKKKKKKKKKKKKK',1],
uni:['..........KY..|.........KYK..|........KMWWK.|.......KMWWWKK|..KKKKKMWWKWK.|.KMWWWWWWWWK..|.KMWWWWWWWWK..|.KWWWWWWWWK...|..KKWWWKKK....|..KW....KW....|..KK....KK....',0],
uni2:['..........KY..|.........KYK..|........KMWWK.|.......KMWWWKK|..KKKKKMWWKWK.|.KMWWWWWWWWK..|.KMWWWWWWWWK..|.KWWWWWWWWK...|.KKW...WKKKW..|.KW......KW...|.KK......KK...',0],
boss:['..........KKKKKK|.......KKKCCCCCC|.....KKCCCCCCCCC|....KCCCCSSSSSSS|...KCCCSSCCCCCCC|..KCCCSCCCCCCCCC|.KCCCSCCCDCCCDCC|KCCCCSCCCCCCCCCC|KCCCCCSCCCDCCCDC|KCCCCCCCCCCCCCCC|.KCCCCCCCCCCCCCC|..KKCCCCCCCCCCCC|....KKKKKKKKKKKK|.......KKKCCCCCC|......KCSSKEEEEE|......KCCCKEEEKE|......KCCCKEEEEE|......KDDDDKKKKK|.......KKKKKKKKK',1],
star:['..K..|.KYK.|KYYYK|.KYK.|..K..',0],
heart:['.KK.KK.|KMMKMMK|KMMMMMK|.KMMMK.|..KMK..|...K...',0],
cage:['KKKKKKK|KSKSKSK|KSKSKSK|KSKSKSK|KKKKKKK',0]
};
// Draws a sprite from its string, adds the white "sticker" outline,
// and prepares two variants: f = all white (flash), s = dark shadow.
function spr(d){ var rows=d[0].split('|'), h=rows.length, hw=rows[0].length, w=d[1]?hw*2:hw;
  var c=mk(w+2,h+2), g=c.getContext('2d');
  for(var y=0;y<h;y++) for(var x=0;x<hw;x++){ var ch=rows[y][x]; if(ch=='.') continue;
    g.fillStyle=PAL[ch]; g.fillRect(x+1,y+1,1,1); if(d[1]) g.fillRect(w-x,y+1,1,1); }
  var o=mk(c.width,c.height), q=o.getContext('2d');
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(v){ q.drawImage(c,v[0],v[1]); });
  q.globalCompositeOperation='source-in'; q.fillStyle='#fff'; q.fillRect(0,0,o.width,o.height);
  q.globalCompositeOperation='source-over'; q.drawImage(c,0,0);
  return {c:o,f:tint(o,'#fff'),s:tint(o,'#000'),w:o.width,h:o.height}; }
function tint(c,col){ var o=mk(c.width,c.height), g=o.getContext('2d'); g.drawImage(c,0,0);
  g.globalCompositeOperation='source-in'; g.fillStyle=col; g.fillRect(0,0,o.width,o.height); return o; }
var S={}; for(var k in SPD) S[k]=spr(SPD[k]);
// Centered draw, with an offset drop shadow (the "sticker" look of the reference)
function dr(sp,x,y,fl,sc,img,sy){ x|=0; y|=0; sc=sc||1;
  X.save(); X.translate(x,y); X.scale(fl?-sc:sc,sy||sc); X.drawImage(img||sp.c,-sp.w/2|0,-sp.h/2|0); X.restore(); }

// ---------- Audio: ZzFX-like sounds + a small generative music ----------
var AC, mg, sg, musOn=0, muted=0, musNext=0, musI=0, duck=0, vN=0, vF=-1;
function ensureAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended'&&!paused) AC.resume();
  // SFX bus: a compressor keeps 10 simultaneous sounds (a death, a bomb) from saturating
  // the phone speaker, which would be heard as crackling.
  if(AC&&!sg){ try{ sg=AC.createGain(); sg.gain.value=.7; var cp=AC.createDynamicsCompressor();
    cp.threshold.value=-24; cp.ratio.value=12; sg.connect(cp); cp.connect(AC.destination); }catch(e){ sg=null; } }
  return AC; }
// At most 4 voices per frame: beyond that it turns to mush, and it saturates.
function voice(){ if(vF!=t){ vF=t; vN=0; } return ++vN<=4; }
function snd(f,d,ty,v,f2){ if(paused||!ensureAudio()||muted||!voice()) return; try{
  var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  o.type=ty||'square'; o.frequency.value=f; g.gain.value=v||.05;
  o.connect(g); g.connect(sg||AC.destination); o.start();
  o.frequency.exponentialRampToValueAtTime(f2||f*.5,t+d);
  g.gain.exponentialRampToValueAtTime(.0001,t+d); o.stop(t+d); }catch(e){} }
function nz(d,v){ if(paused||!ensureAudio()||muted||!voice()) return; try{
  var n=AC.sampleRate*d|0, b=AC.createBuffer(1,n,AC.sampleRate), a=b.getChannelData(0);
  for(var i=0;i<n;i++) a[i]=(R()*2-1)*(1-i/n)*(1-i/n);
  var s=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter();
  s.buffer=b; f.type='lowpass'; f.frequency.value=900; g.gain.value=v||.2;
  s.connect(f); f.connect(g); g.connect(sg||AC.destination); s.start(); }catch(e){} }
// Game SFX
var SFX={
  shot:function(){ if(t>duck) snd(900,.06,'square',.02,300); },
  hit:function(){ snd(240+min(combo,24)*11,.07,'square',.03,120); },
  boom:function(big){ nz(big?.5:.25,big?.28:.16); snd(120,.3,'sawtooth',.06,30); duck=t+20; },
  pick:function(){ if(t-pickT>50) pickN=0; pickT=t; pickN=min(pickN+1,22);
    snd(620+pickN*45,.08,'triangle',.04,1300+pickN*70); },
  hurt:function(){ nz(.4,.25); snd(200,.5,'sawtooth',.08,40); duck=t+40; },
  hyper:function(f){ (f?[0,4,7,12,16,19,24]:[0,4,7,12]).forEach(function(n,i){ setTimeout(function(){ snd(440*Math.pow(2,n/12),f?.35:.25,f?'sawtooth':'triangle',.055,880*Math.pow(2,n/12)); },i*(f?55:70)); }); if(f) nz(.6,.2); duck=t+(f?50:30); },
  free:function(){ [0,4,7,12,16].forEach(function(n,i){ setTimeout(function(){ snd(660*Math.pow(2,n/12),.3,'triangle',.05); },i*90); }); }
};
// ---------- Music: M3 "Sky Glider", synthwave 148 BPM in D minor ----------
// Four phases chained automatically: i = intro (cruising through the clouds),
// r = gameplay, b = boss and mini boss, h = hyper and ultra. Written in scale degrees,
// melodies encoded as strings ('.' = rest, otherwise character code - 100).
var SC3=[0,2,3,5,7,8,10], RT3=50, E8=60/148/4;
var ML3={i:'..h.f.d.....f.....i.h.f...d.....',
         r:'..h.f.d..f.h..f...i.h.f.d.c.d.f.',
         b:'k.j.h.f.h.f.d.c.k.m.k.j.h.f.h.j.',
         h:'rpomoprtrpomkmoptrprtvtrpomoprtv'};
function dg3(d){ var o=Math.floor(d/7), i=((d%7)+7)%7; return RT3+SC3[i]+o*12; }
function hz3(n){ return 440*Math.pow(2,(n-69)/12); }
function mN(f,at,d,ty,v,det){ try{ var o=AC.createOscillator(), g=AC.createGain();
  o.type=ty; o.frequency.value=f; if(det) o.detune.value=det; o.connect(g); g.connect(mg);
  g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(v,at+.02);
  g.gain.exponentialRampToValueAtTime(.0001,at+d); o.start(at); o.stop(at+d+.05); }catch(e){} }
function mB(f,at,d,v,cut){ try{ var o=AC.createOscillator(), g=AC.createGain(), fl=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=f; fl.type='lowpass'; fl.Q.value=5;
  fl.frequency.setValueAtTime(cut*1.8,at); fl.frequency.exponentialRampToValueAtTime(cut,at+d*.8);
  o.connect(fl); fl.connect(g); g.connect(mg);
  g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(v,at+.01);
  g.gain.exponentialRampToValueAtTime(.0001,at+d); o.start(at); o.stop(at+d+.05); }catch(e){} }
var nb3;
function mNz(at,d,v,f0,hp){ try{ if(!nb3){ var n=AC.sampleRate|0; nb3=AC.createBuffer(1,n,AC.sampleRate);
    var a=nb3.getChannelData(0); for(var i=0;i<n;i++) a[i]=R()*2-1; }
  var s2=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter();
  s2.buffer=nb3; f.type=hp?'highpass':'bandpass'; f.frequency.value=f0;
  s2.connect(f); f.connect(g); g.connect(mg);
  g.gain.setValueAtTime(v,at); g.gain.exponentialRampToValueAtTime(.0001,at+d);
  s2.start(at); s2.stop(at+d+.03); }catch(e){} }
function mK(at,v){ try{ var o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(165,at); o.frequency.exponentialRampToValueAtTime(42,at+.11);
  o.connect(g); g.connect(mg); g.gain.setValueAtTime(v,at);
  g.gain.exponentialRampToValueAtTime(.0001,at+.22); o.start(at); o.stop(at+.3); }catch(e){} }
function musStep(i,at){
  var ph=(mode!='play'||mist>0)?'i':hyper?'h':boss?'b':'r';
  var sd=i%16, b=i>>4, bar=b%4, ch=(ph=='b'?[0,4,5,4]:[0,5,3,4])[bar], i32=(b%2)*16+sd, S=E8;
  // drums. In the intro a soft hi-hat keeps the pulse without breaking the floaty mood.
  if(ph=='i'){ if(sd==0&&bar%2==0) mK(at,.42);
    if(sd%2==0) mNz(at,.03,sd%4==0?.09:.05,7600,1);
    if(sd==14) mNz(at,.12,.07,7000,1); }
  else { if(sd==0||sd==8||(ph!='r'&&sd==14)) mK(at,.8);
    if(sd%8==4){ mNz(at,.15,ph=='b'?.26:.2,1800); mN(190,at,.08,'triangle',.05); }
    if(ph=='h'||sd%2==0) mNz(at,.032,sd%4==0?.11:.07,7200,1); }
  // pad
  var cn=[dg3(ch),dg3(ch+2),dg3(ch+4)];
  if(sd==0) cn.forEach(function(n){ [-8,8].forEach(function(dt){
    mN(hz3(n+12),at,S*(ph=='i'?8:7),'sawtooth',ph=='i'?.035:.022,dt); }); });
  // bass
  var br=dg3(ch)-12;
  if(ph=='i'){ if(sd%8==0) mB(hz3(br),at,S*3.6,.2,520); }
  else if(sd%2==0) mB(hz3(br+(sd%8==6?7:0)),at,S*1.6,.22,ph=='b'?700:950);
  // continuous arpeggio, the track's signature
  var an=cn[[0,1,2,1,2,1,0,1][sd%8]]+(ph=='h'?24:12);
  mN(hz3(an),at,S*1.3,'triangle',ph=='i'?.035:.05);
  if(ph=='h') mN(hz3(an+7),at,S*1.1,'square',.025,8);
  // melody
  var c=ML3[ph][i32];
  if(c!='.') mN(hz3(dg3(ch+c.charCodeAt(0)-100)+12),at,S*(ph=='h'?1.4:3.2),
    ph=='b'?'square':'triangle',ph=='i'?.05:.07); }
function musTick(){ if(!AC||!musOn||paused) return; var ahead=AC.currentTime+.2;
  musNext=max(musNext,AC.currentTime);
  while(musNext<ahead){ musStep(musI,musNext); musNext+=E8; musI++; } }
function startMusic(){ if(musOn||!ensureAudio()) return; musOn=1;
  mg=AC.createGain(); mg.gain.value=muted?0:.45; mg.connect(AC.destination);
  musNext=AC.currentTime+.1; setInterval(musTick,45); }
function toggleMute(){ muted=!muted; if(mg) mg.gain.setTargetAtTime(muted?0:.45,AC.currentTime,.05); }

// ---------- State ----------
var mode='title', paused=0, t=0, freeze=0, shake=0, wflash=0, zoom=0, graze=0, pickN=0, pickT=-99, wasRdy=0, scroll=0, schedI=0;
var P, shots, enemies, buls, parts, picks, pops, unis, queue;
// Leading digit = speaker (0 COMMAND, 1 PILOT), '|' separates the two lines.
var DLG=['0GOBLINS CAGED EVERY UNICORN|ON THE ISLAND BELOW YOU.',
         '1I SEE THE COAST. GOING IN|UNDER THE CLOUDS.',
         '0SMASH EVERY CAGE YOU FIND.|SET THEM ALL FREE.',
         '1BEGINNING THE RAID.'];
var dli=0, dch=0, dwait=0, dtick=0, ddone=0, dstart=0;
// Same pitch and same envelope for both, only the waveform changes:
// square for COMMAND (a dry "tick"), triangle for PILOT (a round "toop"), plus an attack click.
function dblip(k){ snd(620,.048,k?'triangle':'square',.05,384); snd(k?1800:3200,.014,'square',.018,900); }
function dnext(){ dwait=0; dtick=0; if(dli<DLG.length-1){ dli++; dch=0; } else ddone=1; }
function dadv(){ if(ddone) return 1;                 // returns 1 once the briefing is over
  if(!dstart){ dstart=1; return 0; }                 // the first press opens the channel
  var L=DLG[dli]; if(dch<L.length-1){ dch=L.length-1; dwait=140; } else dnext(); return 0; }
// Back at the menu after a run, the briefing has been seen: leave it finished.
function dreset(){ dli=dch=dwait=dtick=0; ddone=1; dstart=1; }
var score, best=0, lives, charge, hyper, ultra, ultraT, mist, invul, flashShip, coyote, deadCb, freed, combo, comboT, flyin, endT, boss, shotWait;
var CHMAX=300, CHTHR=150;
try{ best=+localStorage.rainbowRaidBest||0; }catch(e){}
function saveBest(){ if(score>best){ best=score; try{ localStorage.rainbowRaidBest=best; }catch(e){} } }

// ---------- Background: procedural map (ocean, rivers, beaches, meadows, forests, mountains) ----------
// Value noise on a grid of 8 px tiles. Rows are generated as they enter from the top
// and stored in a ring canvas G; every frame the visible strips are copied back.
// rowT keeps each tile's type to animate the water.
var T8=12, NR, G, GX, genTo, rowT, seed=0, TW=LW/T8, sl=[], land=0, spd=2.6, scr0=0, crate=2, cacc=0, cv=7;
// 3 parallax layers, like Cattle Crisis: far/small/slow at the back, big/fast in front.
function setupClouds(){ clouds=[];
  // All at the same speed and spread over the whole screen from the start.
  crate=2; cacc=0; cv=7;
  for(var y=-48;y<LH+48;y+=17) for(var j=0;j<2;j++)
    clouds.push(cloud(rr(-30,LW+30),y+rr(-8,8),rr(17,40),cv)); }
// A cloud = a cluster of 3 to 5 lobes: that is what makes it look fluffy
// rather than a plain circle. The first lobe is the body, the others are bumps.
function cloud(x,y,r,dy,amb){ var n=4+(R()*3|0), L=[[0,0,.92]];
  for(var i=1;i<n;i++) L.push([rr(-1.25,1.25),rr(-.35,.35),rr(.45,.85)]);
  return {x:x,y:y,r:r,dy:dy,L:L,amb:amb}; }
function hash(x,y){ var h=(x*374761393+y*668265263+seed*1274126177)|0; h=(h^h>>>13)*1274126177|0; return ((h^h>>>16)>>>0)/4294967296; }
function vnoise(x,y){ var xi=Math.floor(x), yi=Math.floor(y), fx=x-xi, fy=y-yi; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
  var a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy; }
// types: 0 deep water, 1 water, 2 sand, 3 grass, 4 forest, 5 hill, 6 mountain
var TC=['#48aede','#88d2ec','#f3cf91','#afd995','#89c38c','#c2adef','#ad97df'];
// land is 0 at takeoff (open ocean) and rises to 1: the island emerges beneath us.
function tileAt(x,y,lv){ var h=(vnoise(x/13,y/13)*.7+vnoise(x/5+9,y/5)*.3)*(.42+lv*.72)-(1-lv)*.06;
  var rv=abs(vnoise(x/12+40,y/12+7)-.5); if(rv<.022&&h<.72&&h>.38) return 1;
  return h<.31?0:h<.38?1:h<.45?2:h<.6?3:h<.7?4:h<.8?5:6; }
function initBg(){ NR=Math.ceil(LH/T8)+3; G=mk(LW,NR*T8); GX=G.getContext('2d'); genTo=-1; rowT=[]; seed=R()*1e6|0;
  setupClouds();
  sl=[]; for(var i=0;i<22;i++) sl.push({x:R()*LW,y:R()*LH,l:rr(5,16),v:rr(5,11)}); }
// Biomes are sampled every 2 pixels: coastlines follow the continuous noise
// instead of forming big squares. Everything stays cached in G.
function genRow(r){ var ry=(r%NR)*T8, g=GX, row=rowT[r%NR]=[], lv=land;
  for(var y=0;y<T8;y+=2) for(var x=0;x<LW;x+=2){
    var nx=x/T8, ny=r+1-y/T8, k=tileAt(nx,ny,lv), up=tileAt(nx,ny+1/6,lv), lf=tileAt(nx-1/6,ny,lv);
    g.fillStyle=k==2&&(up<2||lf<2||tileAt(nx,ny-1/6,lv)<2||tileAt(nx+1/6,ny,lv)<2)?'#fff1e8':TC[k]; g.fillRect(x,ry+y,2,2);
    if(k>2&&up<k&&up>1){ g.fillStyle=k>4?'#8f7bc4':'#c7efba'; g.fillRect(x,ry+y,2,1); }
    if(k<5&&(up>4||lf>4)){ g.fillStyle=x%6?'#8f7bc4':'#6f5aa8'; g.fillRect(x,ry+y,2,2); }
  }
  for(var x=0;x<TW;x++){ var k=tileAt(x+.5,r+.5,lv), px=x*T8, hv=hash(x*7,r*13); row[x]=k;
    var tx=px+3+(hv*5|0), ty=ry+2;
    if(k==4&&hv<.6){ // lit foliage and a small trunk, placed irregularly
      g.fillStyle='rgba(50,30,60,.22)'; g.fillRect(tx,ty+5,8,5);
      g.fillStyle='#3e7f56'; if(hv<.3) g.fillRect(tx+3,ty-1,3,3); g.fillRect(tx+1,ty,5,7); g.fillRect(tx,ty+1,7,5); g.fillRect(tx+3,ty+7,1,2);
      g.fillStyle='#5fb075'; g.fillRect(tx+2,ty+1,3,5); g.fillRect(tx+1,ty+2,5,3);

// ---------- Game loop ----------
function newGame(){ mode='play'; paused=0; actP=0; wasRdy=0; deadCb=null; shotWait=0; endT=0; comboT=0; mist=1; spd=2.6; land=0; graze=0; zoom=0; scr0=0; runStart=0; t=0; scroll=0; genTo=-1; schedI=0; initBg(); score=0; lives=3; charge=0; hyper=0; ultra=0; ultraT=0; invul=90; flyin=40;

  // enemy bullets: pink with an outline and a white core, easy to read on pastel
  buls.forEach(function(b){ var x=b.x|0,y=b.y|0; X.fillStyle='#3b2540'; X.beginPath(); X.arc(x,y,b.r+1,0,PI2); X.fill();
    X.fillStyle=b.r>2?'#ff6ad5':'#ff6b8a'; X.beginPath(); X.arc(x,y,b.r,0,PI2); X.fill(); X.fillStyle='#fff'; X.fillRect(x-1,y-1,b.r>2?2:1,b.r>2?2:1); });
  pops.forEach(function(p){ txt(p.s,p.x|0,p.y|0,p.c,'center',p.big); });
  X.restore();
  if(hyper){ var bw2=ultra?4:2;   // the screen is rimmed with rainbow for as long as it lasts
    for(var i=0;i<7;i++){ X.fillStyle=RB[(i+t/3)%7|0]; X.globalAlpha=.8-i*.07;
      var o=i*bw2/7, th=bw2/7+1;
      X.fillRect(0,o,LW,th); X.fillRect(0,LH-o-th,LW,th);
      X.fillRect(o,0,th,LH); X.fillRect(LW-o-th,0,th,LH); }
    X.globalAlpha=1; }
  if(wflash>0){ X.fillStyle='rgba(255,255,255,'+wflash+')'; X.fillRect(0,0,LW,LH); }
  drawHUD();
  // We start ABOVE the clouds: a thick layer covers the screen on the title,
  // then tears apart when the run starts (mist drops from 1 to 0).
  if(mode=='title') drawTitle(); else if(mode=='over'||mode=='win') drawEnd();
  if(lives==1&&mode=='play'){ var v=.1+sin(t*.1)*.06;   // last life: the edges turn red
    var g2=X.createRadialGradient(LW/2,LH/2,LH*.3,LW/2,LH/2,LH*.75);
    g2.addColorStop(0,'rgba(255,60,110,0)'); g2.addColorStop(1,'rgba(255,60,110,'+v+')');
    X.fillStyle=g2; X.fillRect(0,0,LW,LH); }
  if(paused){ X.fillStyle='rgba(43,29,51,.8)'; X.fillRect(0,0,LW,LH);
    txt('PAUSED',LW/2,LH/2-14,'#ffe27a','center',1);
    txt('SPACE / TAP TO RESUME',LW/2,LH/2+6,'#fff','center');
    txt(isTouch?'DRAG TO MOVE - AUTO FIRE':'SHIFT = SLOW MOVEMENT',LW/2,LH/2+22,'#8ed0ff','center'); }
  M.fillStyle='#2b1d33'; M.fillRect(0,0,C.width,C.height);
  var z=1+zoom, zw=LW*SC*z, zh=LH*SC*z;
  M.drawImage(B,OX-(zw-LW*SC)/2|0,OY-(zh-LH*SC)/2|0,zw|0,zh|0);
  }
function drawHUD(){ if(mode=='title') return;
  X.fillStyle='rgba(43,29,51,.82)'; X.fillRect(0,LH-9,LW,9);
  txt(String(score).padStart(7,'0'),3,11,'#fff');
  for(var i=0;i<lives;i++) X.drawImage(S.heart.c,LW-11-i*10,4);
  // freed unicorns
  X.drawImage(S.uni.c,LW/2-24,1); txt('x'+freed,LW/2-6,11,'#ff6ad5');
  X.fillStyle='#fff1e8'; X.fillRect(133,5,2,5); X.fillRect(137,5,2,5);
  // hyper gauge (rainbow when ready)
  var w=LW-8, f=charge/CHMAX; X.fillStyle='#3b2540'; X.fillRect(3,LH-6,w+2,5);
  if(hyper){ for(var i=0;i<7;i++){ X.fillStyle=ultra?(t%4<2?'#fff':RB[(i+t/2)%7|0]):RB[(i+t/4)%7|0]; X.fillRect(4+w*f*i/7|0,LH-5,w*f/7+1|0,3); } }
  else { X.fillStyle=charge>=CHMAX-2?'#ffe27a':charge>=CHTHR?'#ff6ad5':'#8ed0ff'; X.fillRect(4,LH-5,w*f|0,3); }
  X.fillStyle='#ffe27a'; X.fillRect(4+w/2|0,LH-7,1,6);
  txt('BLADE',LW/2-4,LH-2,'#fff','right'); txt('BLAST',LW-4,LH-2,'#fff','right');
  if(canAct()){ var ul=charge>=CHMAX-2, col=ul?'#ffe27a':'#ff6ad5';
    if(!isTouch&&t%40<26) txt(ul?'SPACE = RAINBOW BLAST!':'SPACE = HORN BLADE!',LW/2,LH-22,col,'center'); }
  if(combo>=5) txt('COMBO x'+(1+(combo/10|0))+' ('+combo+')',LW-3,23,'#ffe27a','right');
  if(graze) txt('GRAZE '+graze,3,23,'#8ed0ff');
  // On mobile: high-contrast button and a colored ring pulsing when the power is ready.
  if(isTouch&&canAct()){ var ul=charge>=CHMAX-2, bx=LW-27, by=LH-30, pr=19+sin(t*.25)*2;
    X.strokeStyle=ul?'#ffe27a':'#ff6ad5'; X.lineWidth=2;
    X.beginPath(); X.arc(bx,by,pr,0,PI2); X.stroke();
    X.fillStyle='#3b2540'; X.beginPath(); X.arc(bx,by,18,0,PI2); X.fill();
    txt(ul?'BLAST':'BLADE',bx,by+3,ul?'#ffe27a':'#ff6ad5','center'); } }
// The title screen IS the start of the intro: same sky, same clouds, the ship
// is already there and flying. Pressing only clears the clouds away.
function drawTitle(){
  var ty0=LH*.22;
  for(var i=0;i<7;i++){ X.strokeStyle=RB[i]; X.lineWidth=5; X.globalAlpha=.9;
    X.beginPath(); X.arc(LW/2,ty0+58,74-i*5,3.25,6.18); X.stroke(); }
  X.globalAlpha=1;
  dr(S.uni,LW/2-52,ty0+34+sin(t*.07)*3); dr(S.uni,LW/2+52,ty0+34+sin(t*.07+2)*3,1);
  // big title, each letter sitting on one color of the rainbow
  for(var k=0;k<2;k++){ var w=k?'RESCUE':'UNICORN', sc=4, ad=3*sc+7, tw=w.length*ad-7, x0=LW/2-tw/2|0;
    for(var i=0;i<w.length;i++){ var xx=x0+i*ad, yb=ty0-30+k*26+sin(t*.06+k+i*.5)*2|0;
      X.fillStyle=RB[(i+k*3)%7]; X.beginPath(); tpath(w[i],xx+3,yb+3,sc); X.fill();   // colored shadow
      X.fillStyle='#3b2540'; X.beginPath();                                          // thick outline
      for(var o=0;o<8;o++) tpath(w[i],xx+[2,-2,0,0,2,-2,2,-2][o],yb+[0,0,2,-2,2,-2,-2,2][o],sc);
      X.fill(); X.fillStyle='#fff1e8'; X.beginPath(); tpath(w[i],xx,yb,sc); X.fill(); } }
  // tagline on a panel, otherwise it gets lost among the cloud arcs
  // Radio briefing: dark strip, speaker name in color, oscilloscope
  // jittering while typing and settling once the line has been read.
  var bh=54, by=LH-68, L=DLG[dli], k=+L[0], col=(!dstart||ddone)?'#ffe27a':k?'#8ed0ff':'#ff6ad5';
  X.fillStyle='rgba(45,28,58,.82)'; X.fillRect(0,by,LW,bh);
  X.fillStyle=col; X.fillRect(0,by,LW,1); X.fillRect(0,by+bh-1,LW,1);
  if(!dstart||ddone){ if(t%44<30){
      var m=dstart?(isTouch?'[ TAP TO DIVE ]':'[ SPACE TO DIVE ]'):'[ INCOMING TRANSMISSION ]',
          mw=m.length*6-3, my=by+16|0;
      txt(m,LW/2,my,'#ffe27a','center');
      X.fillStyle='#ffe27a';                       // two rules to frame the tagline
      X.fillRect(6,my-3,LW/2-mw/2-12,1); X.fillRect(LW/2+mw/2+6,my-3,LW/2-mw/2-12,1); }
    txt(isTouch?'DRAG TO MOVE - AUTO FIRE':'ARROWS / WASD - AUTO FIRE',LW/2,by+32,'#fff1e8','center');
    txt(isTouch?'TAP TO START':'SPACE: START   P: PAUSE',LW/2,by+45,'#8ed0ff','center'); }
  else {
    var amp=dwait?1:5;                            // the oscilloscope is only for the dialogue
    X.strokeStyle=col; X.lineWidth=1; X.beginPath();
    for(var i=0;i<46;i++){ var yy=by+11+sin(i*.7+t*.5)*amp*(.4+R()*.6);
      i?X.lineTo(8+i,yy):X.moveTo(8+i,yy); } X.stroke();
    txt((k?'PILOT':'COMMAND')+':',60,by+14,col);
    var p2=L.slice(1,dch+1).split('|');            // two lines per speech
    txt(p2[0],8,by+28,'#fff1e8'); if(p2[1]!=null) txt(p2[1],8,by+42,'#fff1e8');
    if(dwait&&t%30<18){ X.fillStyle='#ffe27a';     // the small 'next' triangle
      for(var i=0;i<4;i++) X.fillRect(LW-12-i,by+bh-12+i,1+i*2,1); } }
  if(best) txt('BEST '+best,3,LH-5,'#ff6ad5'); txt('M mute',LW-3,LH-5,'#c9b3ff','right'); }
function drawEnd(){ var w=mode=='win'; X.fillStyle='rgba(59,37,64,'+min(.5,endT/60)+')'; X.fillRect(0,0,LW,LH);
  if(endT<20) return;
  txt(w?'ISLAND SAVED!':'GAME OVER',LW/2,90,w?'#ffe27a':'#ff6b8a','center',1);
  txt('SCORE '+score,LW/2,112,'#fff','center'); txt('UNICORNS FREED '+freed,LW/2,124,'#ff6ad5','center');
  if(score>=best&&score) txt('NEW BEST!',LW/2,136,'#ffe27a','center');
  if(w){ for(var i=0;i<3;i++) dr(i%2?S.uni2:S.uni,LW/2-30+i*30,155-abs(sin(t*.15+i))*6,i&1); }
  if(endT>60&&t%40<25) txt('PRESS SPACE / TAP',LW/2,200,'#fff','center'); }
var last=0, acc=0;
// The next frame is requested before the update. An error stays visible in the
// browser console, without being hidden behind an in-game debug screen.
function loop(ts){ requestAnimationFrame(loop);
  var dt=min(.1,(ts-last)/1000)||0; last=ts; acc+=dt;
  if(paused) acc=0; else while(acc>=1/60){ acc-=1/60; step(); }
  render(); }
requestAnimationFrame(loop);

// ---------- Wavedash: initialize when the host injects its SDK ----------
// No SDK is downloaded; ordinary browsers run without platform calls.
// Short identifiers, public names and conditions in wavedash/achievements.json.
var WD=self.Wavedash, wdStats, runStart=0;
function guard(f){ if(WD) try{ var q=f(); if(q&&q.catch) q.catch(function(){}); }catch(e){} }
// The shared load holds back trophies earned before its response arrives.
function award(id){ guard(function(){ return wdStats.then(function(r){
  if(r&&r.success&&r.data===true&&!WD.getAchievement(id)) return WD.setAchievement(id,true); }); }); }
// value is frozen before the network round trip, even if another run starts.
function board(name,value,time){ guard(function(){ return WD.getOrCreateLeaderboard(name,time?0:1,time?2:0).then(function(r){
  if(r&&r.success) return WD.uploadLeaderboardScore(r.data.id,value,true); }); }); }
function LB(){ board('high-score',score);
  if(mode=='win'){ award('WIN'); if(lives==3) award('ACE');
    board('fastest-rescue',(t-runStart)*1000/60|0,1);
    if(freed==43){ award('ALL'); board('perfect-rescue-score',score); } } }
guard(function(){ return WD.init(); });
guard(function(){ return wdStats=WD.requestStats(); });
</script></body></html>
